version: '3.8'

# Eco-Friendly Planner
#   client      React UI served by nginx, proxies /graphql and /booking-api  -> http://localhost:3000
#   server      Planner GraphQL API (users, trips, carbon)                    -> http://localhost:4000/graphql
#   booking-api Dedicated booking REST API (stays, dining, reservations)      -> http://localhost:5000/api/v1
#   mongo_db    MongoDB 6, one database per service

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - server
      - booking-api
    networks:
      - app-network
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      MONGO_URI: mongodb://mongo_db:27017/eco_travel_planner
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      BOOKING_API_URL: http://booking-api:5000
    depends_on:
      - mongo_db
      - booking-api
    networks:
      - app-network
    restart: unless-stopped

  booking-api:
    build:
      context: ./booking-api
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      MONGO_URI: mongodb://mongo_db:27017/eco_bookings
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env} # same secret as the planner: one login for both APIs
      DATA_DRIVER: mongo
      SEED_ON_START: "true"
      CORS_ORIGIN: "*"
    depends_on:
      - mongo_db
    networks:
      - app-network
    restart: unless-stopped

  mongo_db:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    restart: unless-stopped

volumes:
  mongo-data:
    driver: local

networks:
  app-network:
    driver: bridge
